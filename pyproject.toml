[project]
name = "rr-log-analyst"
version = "0.1.0"
description = "AI-Powered Recommendation Log & Config Q&A System"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langchain",
    "langchain-anthropic",
    "langchain-core",
    "httpx",
    "python-dotenv",
    "email-validator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app/ is imported as a package from the repo root
pythonpath = ["."]
